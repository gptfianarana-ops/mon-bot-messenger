name: Tsarafandray autonomous hourly check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-log:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[autonomous-log]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run guarded checks
        run: bash scripts/autonomous_hourly_check.sh

      - name: Commit hourly trace
        run: |
          git config user.name "tsarafandray-autonomous"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG_AUTONOME.md
          git diff --cached --quiet || git commit -m "[autonomous-log] hourly verification"
          git push
